<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>채용공고</title>

  <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>

<body>

<header class="header d-flex align-items-center fixed-top">
  <div class="container-fluid container-xl position-relative d-flex align-items-center">

    <a href="/" class="logo d-flex align-items-center me-auto">
      <h1 class="sitename">Sortech</h1>
    </a>

    <nav id="navmenu" class="navmenu">
      <ul>
        <li><a href="/">홈</a></li>
        <li><a href="/notice">공지사항</a></li>
        <li><a href="/recruitment" class="active">채용공고</a></li>
        <li><a href="/free-board">자유게시판</a></li>
      </ul>
    </nav>

  </div>
</header>

<main class="main">

  <section class="section" style="padding-top: 120px;">

    <div class="container">

      <div class="section-title">
        <h2>채용공고</h2>
        <p>소르테크와 함께 성장할 인재를 모집합니다.</p>
      </div>

      <div class="table-responsive">

        <table class="table">

          <thead>
          <tr>
            <th>번호</th>
            <th>제목</th>
            <th>작성자</th>
          </tr>
          </thead>

          <tbody id="recruitmentList">

          <tr>
            <td colspan="3" class="text-center">
              채용공고가 없습니다.
            </td>
          </tr>

          </tbody>

        </table>

      </div>

      <div id="writeButton"
           class="text-end mt-3"
           style="display: none;">

        <a href="/recruitment/write"
           class="btn btn-primary">
          작성
        </a>

      </div>

    </div>

  </section>

</main>

<script>

  async function loadRecruitments() {

      try {

          const response =
              await fetch("/api/recruitments");

          if (!response.ok) {
              throw new Error(
                  "채용공고를 불러올 수 없습니다."
              );
          }

          const recruitments =
              await response.json();

          const recruitmentList =
              document.getElementById(
                  "recruitmentList"
              );

          if (recruitments.length === 0) {

              recruitmentList.innerHTML = `
                  <tr>
                      <td colspan="3"
                          class="text-center">
                          채용공고가 없습니다.
                      </td>
                  </tr>
              `;

              return;
          }

          recruitmentList.innerHTML = "";

          recruitments.forEach(recruitment => {

              recruitmentList.innerHTML += `
                  <tr>
                      <td>${recruitment.id}</td>

                      <td>
                          <a href="/recruitment/${recruitment.id}">
                              ${recruitment.title}
                          </a>
                      </td>

                      <td>
                          ${recruitment.author}
                      </td>
                  </tr>
              `;

          });

      } catch (error) {

          console.error(error);

      }

  }

  async function checkAdmin() {

      try {

          const response =
              await fetch("/api/me/role");

          if (!response.ok) {
              return;
          }

          const role =
              await response.text();

          if (role === "ROLE_ADMIN") {

              document.getElementById(
                  "writeButton"
              ).style.display = "block";

          }

      } catch (error) {

          console.error(error);

      }

  }

  loadRecruitments();
  checkAdmin();

</script>

</body>

</html>
