<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>공지사항</title>

    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/main.css" rel="stylesheet">
</head>

<body>

<header class="header d-flex align-items-center fixed-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center">

        <a href="/" class="logo d-flex align-items-center me-auto">
            <h1 class="sitename">Sortech</h1>
        </a>

        <nav id="navmenu" class="navmenu">
            <ul>
                <li><a href="/">홈</a></li>
                <li><a href="/notice" class="active">공지사항</a></li>
                <li><a href="/recruitment">채용공고</a></li>
                <li><a href="/free-board">자유게시판</a></li>
            </ul>
        </nav>

    </div>
</header>

<main class="main">

    <section class="section" style="padding-top: 120px;">

        <div class="container">

            <div class="section-title">
                <h2>공지사항</h2>
                <p>소르테크의 새로운 소식을 알려드립니다.</p>
            </div>

            <div class="table-responsive">

                <table class="table">

                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                    </tr>
                    </thead>

                    <tbody id="noticeList">

                    <tr>
                        <td colspan="3" class="text-center">
                            공지사항이 없습니다.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

            <div id="writeButton"
                 class="text-end mt-3"
                 style="display: none;">

                <a href="/notice/write"
                   class="btn btn-primary">
                    작성
                </a>

            </div>

            <div style="margin-top: 30px; text-align: center;">

                <a href="/">
                    ← 메인 홈페이지
                </a>

            </div>

        </div>

    </section>

</main>

<script>

    async function loadNotices() {

        try {

            const response =
                await fetch("/api/notices");

            if (!response.ok) {
                throw new Error(
                    "공지사항을 불러올 수 없습니다."
                );
            }

            const notices =
                await response.json();

            const noticeList =
                document.getElementById("noticeList");

            if (notices.length === 0) {

                noticeList.innerHTML = `
                    <tr>
                        <td colspan="3"
                            class="text-center">
                            공지사항이 없습니다.
                        </td>
                    </tr>
                `;

                return;
            }

            noticeList.innerHTML = "";

            notices.forEach(notice => {

                noticeList.innerHTML += `
                    <tr>
                        <td>${notice.id}</td>

                        <td>
                            <a href="/notice/${notice.id}">
                                ${notice.title}
                            </a>
                        </td>

                        <td>
                            ${notice.author}
                        </td>
                    </tr>
                `;

            });

        } catch (error) {

            console.error(error);

        }

    }

    async function checkAdmin() {

        try {

            const response =
                await fetch("/api/me/role");

            if (!response.ok) {
                return;
            }

            const role =
                await response.text();

            if (role === "ROLE_ADMIN") {

                document.getElementById(
                    "writeButton"
                ).style.display = "block";

            }

        } catch (error) {

            console.error(error);

        }

    }

    loadNotices();
    checkAdmin();

</script>

</body>

</html>
